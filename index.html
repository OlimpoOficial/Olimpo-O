<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OLIMPO</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root {
      --lila: #c77dff;
      --lila-light: #ead7ff;
      --lila-mid: #9d4edd;
      --lila-dark: #5a189a;
      --olympus-gold: #c77dff;
      --olympus-blue: #9d4edd;
      --olympus-red: #7b2cbf;
      --green: #25d366;
      --green-dark: #128c44;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: white;
      min-height: 100svh;
      background-image:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.92) 0%,
          rgba(0,0,0,0.72) 44%,
          rgba(0,0,0,0.30) 100%
        ),
        url("fondo-coliseo-dioses.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 22% 18%, rgba(199, 125, 255, 0.18), transparent 32%),
        radial-gradient(circle at 50% 8%, rgba(157, 78, 221, 0.16), transparent 38%),
        radial-gradient(circle at 18% 58%, rgba(90, 24, 154, 0.18), transparent 35%),
        rgba(0,0,0,0.18);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          115deg,
          transparent 0%,
          rgba(199, 125, 255, 0.08) 30%,
          transparent 47%,
          rgba(157, 78, 221, 0.08) 65%,
          transparent 100%
        );
      mix-blend-mode: screen;
      z-index: 0;
      pointer-events: none;
      animation: auraFondo 8s ease-in-out infinite;
    }

    @keyframes auraFondo {
      0%, 100% {
        opacity: 0.45;
        transform: translateX(-1.5%) scale(1);
      }
      50% {
        opacity: 0.9;
        transform: translateX(1.5%) scale(1.02);
      }
    }

    .page {
      width: 100%;
      min-height: 100svh;
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 14px 0 24px 8vw;
    }

    .content {
      width: min(470px, 92vw);
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .titulo-olimpo {
      position: relative;
      display: inline-block;
      font-size: clamp(3.1rem, 6vw, 4.9rem);
      line-height: 1;
      letter-spacing: clamp(4px, 0.7vw, 8px);
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 900;
      text-shadow:
        0 0 7px rgba(255,255,255,0.95),
        0 0 18px rgba(199,125,255,0.95),
        0 0 36px rgba(157,78,221,0.72),
        0 0 70px rgba(90,24,154,0.55),
        0 8px 26px rgba(0,0,0,1);
      animation: tituloRespira 4s ease-in-out infinite;
      z-index: 2;
    }

    .titulo-olimpo::before {
      content: "";
      position: absolute;
      inset: -36px -58px;
      background:
        radial-gradient(circle at 20% 48%, rgba(199,125,255,0.55), transparent 42%),
        radial-gradient(circle at 70% 48%, rgba(157,78,221,0.45), transparent 43%),
        radial-gradient(circle at 50% 60%, rgba(90,24,154,0.42), transparent 45%),
        linear-gradient(90deg, transparent, rgba(255,255,255,0.20), transparent);
      filter: blur(23px);
      border-radius: 50%;
      z-index: -1;
      opacity: 0.86;
      animation: auroraOlimpo 5.2s ease-in-out infinite;
    }

    .titulo-olimpo::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -13px;
      width: 82%;
      height: 3px;
      transform: translateX(-50%);
      background: linear-gradient(
        90deg,
        transparent,
        var(--lila-light),
        #ffffff,
        var(--lila),
        transparent
      );
      border-radius: 999px;
      box-shadow:
        0 0 12px rgba(255,255,255,0.88),
        0 0 24px rgba(199,125,255,0.82),
        0 0 34px rgba(157,78,221,0.62);
    }

    @keyframes tituloRespira {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.018);
      }
    }

    @keyframes auroraOlimpo {
      0%, 100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 0.70;
      }
      50% {
        transform: translateY(-8px) scale(1.14) rotate(1.5deg);
        opacity: 1;
      }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      width: 100%;
      min-height: 60px;
      padding: 14px 18px;
      border: none;
      border-radius: 18px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      user-select: none;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow:
        0 7px 0 rgba(65, 12, 120, 0.96),
        0 14px 28px rgba(0, 0, 0, 0.56),
        inset 0 2px 0 rgba(255, 255, 255, 0.58);
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255,255,255,0.42) 45%,
        transparent 70%
      );
      transform: translateX(-130%);
      transition: transform 0.45s ease;
      pointer-events: none;
    }

    .btn:hover::after {
      transform: translateX(130%);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.07);
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 rgba(65, 12, 120, 0.96),
        0 8px 16px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-play {
      background: linear-gradient(180deg, #ffffff 0%, #f3f3f3 55%, #d9c6ff 100%);
      border: 3px solid var(--lila);
      font-size: 1.15rem;
    }

    .btn-main {
      background: linear-gradient(180deg, #ead7ff 0%, #c77dff 58%, #7b2cbf 100%);
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.45);
      box-shadow:
        0 7px 0 #4b0f82,
        0 14px 28px rgba(0, 0, 0, 0.56),
        inset 0 2px 0 rgba(255, 255, 255, 0.58);
    }

    .btn-extra {
      background: linear-gradient(180deg, #ead7ff 0%, #c77dff 56%, #7b2cbf 100%);
      color: #fff;
      font-size: 1.55rem;
      border: 2px solid rgba(255,255,255,0.95);
      margin-bottom: 12px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      box-shadow:
        0 7px 0 #4b0f82,
        0 14px 26px rgba(0,0,0,0.46),
        0 0 24px rgba(199,125,255,0.28),
        inset 0 2px 0 rgba(255,255,255,0.42);
    }

    .canal-wrapper {
      margin-top: 4px;
      background: rgba(0,0,0,0.54);
      border: 1px solid rgba(199,125,255,0.58);
      border-radius: 26px;
      padding: 17px;
      box-shadow:
        0 0 0 1px rgba(199,125,255,0.12),
        0 14px 38px rgba(0,0,0,0.62),
        0 0 24px rgba(199,125,255,0.18);
      backdrop-filter: blur(6px);
    }

    .canal-text {
      color: #f2f2f2;
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.45;
      text-shadow: 0 2px 5px rgba(0,0,0,0.90);
    }

    .canal-text b {
      color: var(--lila-light);
      text-shadow: 0 0 12px rgba(199,125,255,0.85);
    }

    .footer-status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .status-box {
      background: rgba(0,0,0,0.56);
      border: 2px solid var(--lila);
      border-radius: 14px;
      padding: 12px 8px;
      color: var(--lila-light);
      font-size: 0.80rem;
      font-weight: 900;
      text-transform: uppercase;
      box-shadow:
        0 0 12px rgba(199,125,255,0.32),
        0 8px 18px rgba(0,0,0,0.44);
      text-shadow: 0 2px 4px rgba(0,0,0,0.85);
    }

    .extra-info {
      margin-top: 16px;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.62);
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.85);
    }

    .character-container {
      position: fixed;
      right: 7vw;
      bottom: 52px;
      z-index: 3;
      width: clamp(190px, 25vw, 315px);
      pointer-events: none;
      opacity: 0.98;
      perspective: 1200px;
      transform-style: preserve-3d;
      transition: transform 0.18s ease-out;
      animation: characterFloat 6s ease-in-out infinite;
    }

    .character-bg {
      width: 100%;
      display: block;
      object-fit: contain;
      filter:
        drop-shadow(0 22px 42px rgba(0,0,0,0.78))
        drop-shadow(0 0 18px rgba(199,125,255,0.28))
        contrast(103%)
        brightness(102%)
        saturate(106%);
      animation: character3D 7s ease-in-out infinite;
    }

    @keyframes characterFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes character3D {
      0%, 100% {
        transform: rotateY(-2.5deg) rotateX(0.8deg);
      }
      50% {
        transform: rotateY(2.5deg) rotateX(-0.8deg);
      }
    }

    .coin-rain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .coin {
      position: absolute;
      top: -80px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, #f6e7ff 0%, #dcb4ff 16%, #c77dff 42%, #7b2cbf 70%, #3c096c 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.26),
        inset 0 0 0 5px rgba(199,125,255,0.22),
        0 0 12px rgba(199,125,255,0.38),
        0 8px 16px rgba(0,0,0,0.35);
      opacity: var(--opacity);
      left: var(--left);
      animation:
        coinFall var(--duration) linear infinite,
        coinSpin var(--spin) linear infinite;
      animation-delay: var(--delay);
    }

    .coin::before {
      content: "$";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(45, 8, 80, 0.78);
      font-size: calc(var(--size) * 0.52);
      font-weight: 900;
      text-shadow: 0 1px 1px rgba(255,255,255,0.45);
    }

    .coin::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(65,16,115,0.48);
    }

    @keyframes coinFall {
      0% {
        transform: translate3d(0, -90px, 0) rotateZ(0deg);
      }
      25% {
        transform: translate3d(var(--drift1), 25vh, 0) rotateZ(95deg);
      }
      50% {
        transform: translate3d(var(--drift2), 52vh, 0) rotateZ(180deg);
      }
      75% {
        transform: translate3d(var(--drift3), 78vh, 0) rotateZ(270deg);
      }
      100% {
        transform: translate3d(var(--drift4), 115vh, 0) rotateZ(360deg);
      }
    }

    @keyframes coinSpin {
      0% {
        filter: brightness(1);
        transform-style: preserve-3d;
      }
      50% {
        filter: brightness(1.35);
      }
      100% {
        filter: brightness(1);
      }
    }

    .ray-burst {
      position: fixed;
      left: 0;
      top: 0;
      width: 8px;
      height: 70px;
      z-index: 9999;
      pointer-events: none;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0) 0%,
        rgba(235,215,255,0.98) 20%,
        rgba(199,125,255,1) 50%,
        rgba(123,44,191,0.95) 78%,
        rgba(255,255,255,0) 100%
      );
      box-shadow:
        0 0 12px rgba(199,125,255,0.9),
        0 0 24px rgba(157,78,221,0.75),
        0 0 38px rgba(123,44,191,0.55);
      animation: burstRay 780ms ease-out forwards;
    }

    .ray-burst::before {
      content: "";
      position: absolute;
      inset: -8px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(255,255,255,0.9),
        rgba(199,125,255,0.9),
        transparent
      );
      filter: blur(7px);
      border-radius: 999px;
    }

    @keyframes burstRay {
      0% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          translate(0, 0)
          scaleY(0.2)
          rotate(var(--rotate));
      }

      70% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          translate(var(--x), var(--y))
          scaleY(var(--scale))
          rotate(var(--rotate));
      }
    }

    #chat-pointer {
      display: none;
      position: fixed;
      bottom: 118px;
      right: 42px;
      z-index: 1000;
      text-align: center;
      color: var(--lila-light);
      animation: bounce 0.8s infinite;
    }

    #chat-pointer .pointer-label {
      background: var(--lila);
      color: #fff;
      padding: 7px 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.72rem;
      margin-bottom: 6px;
      box-shadow: 0 0 14px rgba(199,125,255,0.65);
      white-space: nowrap;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-14px);
      }
    }

    @media (max-width: 1024px) {
      .page {
        padding-left: 5vw;
      }

      .content {
        width: min(470px, 58vw);
      }

      .character-container {
        right: 4vw;
        width: clamp(180px, 26vw, 280px);
      }
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
        background-position: center center;
      }

      .page {
        justify-content: center;
        padding: 12px 10px 24px;
      }

      .content {
        width: min(94vw, 430px);
      }

      .titulo-olimpo {
        font-size: clamp(2.9rem, 14vw, 4rem);
        margin-bottom: 20px;
      }

      .titulo-olimpo::before {
        inset: -28px -36px;
      }

      .btn-group {
        gap: 12px;
      }

      .btn {
        min-height: 54px;
        font-size: 0.95rem;
        border-radius: 16px;
      }

      .btn-play {
        font-size: 1rem;
      }

      .btn-extra {
        font-size: 1.30rem;
      }

      .canal-wrapper {
        padding: 14px;
        background: rgba(0,0,0,0.60);
      }

      .canal-text {
        font-size: 0.78rem;
      }

      .status-box {
        font-size: 0.70rem;
        padding: 10px 6px;
      }

      .character-container {
        right: -82px;
        bottom: 50px;
        width: 225px;
        opacity: 0.58;
        z-index: 2;
      }

      .coin-rain {
        opacity: 0.75;
      }

      .coin {
        animation-duration: calc(var(--duration) * 1.2);
      }

      #chat-pointer {
        right: 22px;
        bottom: 110px;
      }
    }

    @media (max-width: 380px) {
      .titulo-olimpo {
        font-size: 3rem;
      }

      .btn {
        min-height: 51px;
        font-size: 0.86rem;
      }

      .btn-extra {
        font-size: 1.15rem;
      }

      .canal-text {
        font-size: 0.72rem;
      }

      .status-box {
        font-size: 0.64rem;
      }

      .character-container {
        width: 190px;
        right: -84px;
      }
    }
  </style>
</head>

  <div id="chat-pointer">
    <div class="pointer-label">RETIRÁ AQUÍ</div>
    <i class="fas fa-arrow-down fa-2x"></i>
  </div>

  <script>
    function abrirRetiros() {
      if (typeof window.rw === 'function') {
        try {
          window.rw('open');
        } catch (error) {
          console.log('Webchat cargando...');
        }
      }

      const arrow = document.getElementById('chat-pointer');
      arrow.style.display = 'block';

      setTimeout(() => {
        arrow.style.display = 'none';
      }, 7000);
    }

    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return;

      const personaje = document.getElementById('personaje');
      const x = (window.innerWidth / 2 - e.clientX) / 95;
      const y = (window.innerHeight / 2 - e.clientY) / 130;

      personaje.style.transform = `
        translateY(-4px)
        rotateY(${x}deg)
        rotateX(${-y}deg)
      `;
    });

    document.addEventListener('mouseleave', () => {
      const personaje = document.getElementById('personaje');
      personaje.style.transform = 'translateY(0) rotateY(0deg) rotateX(0deg)';
    });

    const coinRain = document.getElementById('coinRain');
    const coinAmount = window.innerWidth < 768 ? 18 : 34;

    for (let i = 0; i < coinAmount; i++) {
      const coin = document.createElement('span');
      coin.className = 'coin';

      const size = Math.floor(Math.random() * 14) + 14;
      const left = Math.random() * 100;
      const duration = (Math.random() * 5 + 6).toFixed(2) + 's';
      const delay = (Math.random() * -10).toFixed(2) + 's';
      const spin = (Math.random() * 1.2 + 0.8).toFixed(2) + 's';
      const opacity = (Math.random() * 0.35 + 0.25).toFixed(2);

      coin.style.setProperty('--size', size + 'px');
      coin.style.setProperty('--left', left + 'vw');
      coin.style.setProperty('--duration', duration);
      coin.style.setProperty('--delay', delay);
      coin.style.setProperty('--spin', spin);
      coin.style.setProperty('--opacity', opacity);

      coin.style.setProperty('--drift1', (Math.random() * 60 - 30) + 'px');
      coin.style.setProperty('--drift2', (Math.random() * 90 - 45) + 'px');
      coin.style.setProperty('--drift3', (Math.random() * 70 - 35) + 'px');
      coin.style.setProperty('--drift4', (Math.random() * 110 - 55) + 'px');

      coinRain.appendChild(coin);
    }

    function createRayBurst(button) {
      const rect = button.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const amount = window.innerWidth < 768 ? 12 : 20;

      for (let i = 0; i < amount; i++) {
        const ray = document.createElement('span');
        ray.className = 'ray-burst';

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 110 + 45;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        const height = Math.random() * 45 + 45;
        const scale = Math.random() * 0.9 + 0.75;
        const rotate = Math.floor((angle * 180) / Math.PI) + 'deg';

        ray.style.left = centerX + 'px';
        ray.style.top = centerY + 'px';
        ray.style.height = height + 'px';
        ray.style.setProperty('--x', x + 'px');
        ray.style.setProperty('--y', y + 'px');
        ray.style.setProperty('--scale', scale);
        ray.style.setProperty('--rotate', rotate);

        document.body.appendChild(ray);

        setTimeout(() => {
          ray.remove();
        }, 820);
      }
    }

    document.querySelectorAll('.btn').forEach((button) => {
      button.addEventListener('click', () => {
        createRayBurst(button);
      });
    });
  </script>
